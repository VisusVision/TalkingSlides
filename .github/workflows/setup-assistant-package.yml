name: Setup Assistant packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/setup_assistant/**"
      - "packaging/setup_assistant/**"
      - "requirements-setup-assistant.txt"
      - "tests/setup_assistant/**"
      - ".github/workflows/setup-assistant-package.yml"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows executable
            runner: windows-latest
            suffix: windows-x86_64
          - name: Linux portable executable
            runner: ubuntu-latest
            suffix: linux-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-setup-assistant.txt

      - name: Install setup-assistant dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-setup-assistant.txt

      - name: Install Ubuntu Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6

      - name: Preflight PySide6 import on Ubuntu
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6 import QtCore, QtWidgets; print('PySide6 Qt', QtCore.qVersion())"

      - name: Run setup-assistant tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -p no:django -c tests/setup_assistant/pytest.ini tests/setup_assistant -q

      - name: Run setup-assistant tests on Ubuntu
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -p no:django -c tests/setup_assistant/pytest.ini tests/setup_assistant -q

      - name: Build target-native executables
        run: python packaging/setup_assistant/build.py

      - name: Smoke Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" --help
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" check --profile core --repository . --json > ".\dist\setup-assistant\check.json"
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" report --profile core --repository . --format json --output ".\dist\setup-assistant\report.json"
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }
          python -m json.tool ".\dist\setup-assistant\check.json" > $null
          python -m json.tool ".\dist\setup-assistant\report.json" > $null
          & ".\dist\setup-assistant\TalkingSlides-Setup.exe" --smoke

      - name: Smoke Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/setup-assistant/talkingslides-setup --help
          set +e
          ./dist/setup-assistant/talkingslides-setup check --profile core --repository . --json > ./dist/setup-assistant/check.json
          check_exit=$?
          ./dist/setup-assistant/talkingslides-setup report --profile core --repository . --format json --output ./dist/setup-assistant/report.json
          report_exit=$?
          set -e
          test "$check_exit" -eq 0 -o "$check_exit" -eq 1
          test "$report_exit" -eq 0 -o "$report_exit" -eq 1
          python -m json.tool ./dist/setup-assistant/check.json > /dev/null
          python -m json.tool ./dist/setup-assistant/report.json > /dev/null
          ./dist/setup-assistant/TalkingSlides-Setup --smoke

      - name: Archive Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\dist\setup-assistant\TalkingSlides-Setup.exe", ".\dist\setup-assistant\talkingslides-setup-cli.exe" `
            -DestinationPath ".\dist\TalkingSlides-Setup-0.1.0-${{ matrix.suffix }}.zip"

      - name: Archive Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -C dist/setup-assistant -czf "dist/TalkingSlides-Setup-0.1.0-${{ matrix.suffix }}.tar.gz" \
            TalkingSlides-Setup talkingslides-setup

      - name: Upload versioned package
        uses: actions/upload-artifact@v4
        with:
          name: TalkingSlides-Setup-0.1.0-${{ matrix.suffix }}-${{ github.sha }}
          path: |
            dist/TalkingSlides-Setup-0.1.0-${{ matrix.suffix }}.zip
            dist/TalkingSlides-Setup-0.1.0-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error
          retention-days: 14
