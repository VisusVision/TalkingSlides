name: Setup Assistant packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/setup_assistant/**"
      - "packaging/setup_assistant/**"
      - "requirements-setup-assistant.txt"
      - "tests/setup_assistant/**"
      - "docs/SETUP_ASSISTANT.md"
      - "docs/SETUP_ASSISTANT_RELEASE_NOTES.md"
      - ".github/workflows/setup-assistant-package.yml"
  push:
    tags:
      - "setup-assistant-v*"

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows executable
            runner: windows-latest
            platform: windows
            suffix: windows-x64
          - name: Linux portable executable
            runner: ubuntu-latest
            platform: linux
            suffix: linux-x64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-setup-assistant.txt

      - name: Resolve package version
        id: version
        run: python packaging/setup_assistant/release.py github-env

      - name: Install setup-assistant dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-setup-assistant.txt

      - name: Install Ubuntu Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libopengl0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libfontconfig1 \
            libfreetype6

      - name: Preflight PySide6 import on Ubuntu
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6 import QtCore, QtWidgets; print('PySide6 Qt', QtCore.qVersion())"

      - name: Run setup-assistant tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -p no:django -c tests/setup_assistant/pytest.ini tests/setup_assistant -q

      - name: Run setup-assistant tests on Ubuntu
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -p no:django -c tests/setup_assistant/pytest.ini tests/setup_assistant -q

      - name: Build target-native executables
        env:
          SETUP_ASSISTANT_VERSION: ${{ steps.version.outputs.version }}
        run: python packaging/setup_assistant/build.py

      - name: Smoke Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" --help
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" check --profile core --repository . --json > ".\dist\setup-assistant\check.json"
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }
          & ".\dist\setup-assistant\talkingslides-setup-cli.exe" report --profile core --repository . --format json --output ".\dist\setup-assistant\report.json"
          if ($LASTEXITCODE -notin @(0, 1)) { exit $LASTEXITCODE }
          python -m json.tool ".\dist\setup-assistant\check.json" > $null
          python -m json.tool ".\dist\setup-assistant\report.json" > $null
          & ".\dist\setup-assistant\TalkingSlides-Setup.exe" --smoke

      - name: Smoke Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/setup-assistant/talkingslides-setup --help
          set +e
          ./dist/setup-assistant/talkingslides-setup check --profile core --repository . --json > ./dist/setup-assistant/check.json
          check_exit=$?
          ./dist/setup-assistant/talkingslides-setup report --profile core --repository . --format json --output ./dist/setup-assistant/report.json
          report_exit=$?
          set -e
          test "$check_exit" -eq 0 -o "$check_exit" -eq 1
          test "$report_exit" -eq 0 -o "$report_exit" -eq 1
          python -m json.tool ./dist/setup-assistant/check.json > /dev/null
          python -m json.tool ./dist/setup-assistant/report.json > /dev/null
          ./dist/setup-assistant/TalkingSlides-Setup --smoke

      - name: Assemble versioned package artifacts
        run: python packaging/setup_assistant/release.py assemble --platform ${{ matrix.platform }} --version "${{ steps.version.outputs.version }}" --output-dir dist/release

      - name: Upload versioned package
        uses: actions/upload-artifact@v4
        with:
          name: setup-assistant-${{ matrix.suffix }}-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'setup-assistant-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release version
        id: version
        run: python packaging/setup_assistant/release.py github-env

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: setup-assistant-*-x64-${{ github.sha }}
          path: dist/release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: python packaging/setup_assistant/release.py checksums --version "${{ steps.version.outputs.version }}" --artifact-dir dist/release

      - name: Render release notes
        run: python packaging/setup_assistant/release.py notes --version "${{ steps.version.outputs.version }}" --tag "${{ github.ref_name }}" --output dist/release/RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python packaging/setup_assistant/release.py publish --version "${{ steps.version.outputs.version }}" --tag "${{ github.ref_name }}" --artifact-dir dist/release --notes dist/release/RELEASE_NOTES.md
